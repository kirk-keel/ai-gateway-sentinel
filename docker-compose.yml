services:
  # ========================================================
  # Sentinel: AI Security Gateway & FinOps Proxy
  # ========================================================
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-gateway-sentinel
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - LOG_LEVEL=info
      - UPSTREAM_LLM_URL=${UPSTREAM_LLM_URL:-http://mock-upstream:8001/v1}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o}
      - TENANT_HEADER_NAME=x-tenant-id
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - REDIS_CACHE_TTL_SECONDS=3600
      - GUARDRAILS_ENABLED=true
      - GUARDRAILS_BLOCK_ON_PII=false
      - GUARDRAILS_INJECTION_THRESHOLD=0.65
    depends_on:
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - sentinel-net

  # ========================================================
  # Redis: Prompt Exact Caching & FinOps Rate-Limiting
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sentinel-net

  # ========================================================
  # Prometheus: Real-time Telemetry & Metrics Scraper
  # ========================================================
  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - sentinel
    restart: unless-stopped
    networks:
      - sentinel-net

  # ========================================================
  # Grafana: Security & FinOps Visual Dashboards
  # ========================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sentinel-net

  # ========================================================
  # Mock Upstream: Built-in Local LLM Simulator for Testing
  # ========================================================
  mock-upstream:
    image: node:22-alpine
    container_name: sentinel-mock-llm
    working_dir: /app
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      - MOCK_PORT=8001
    command: ["node", "--import", "tsx", "src/mock-upstream/mock-server.ts"]
    restart: unless-stopped
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
